name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1' # weekly, catches newly disclosed patterns

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Compile only (CodeQL just needs the build, tests run in CI/CD workflow)
        run: mvn -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v3
